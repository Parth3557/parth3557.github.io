name: Publish the site

# Every push to main rebuilds the public pages, including content saved from the dashboard's editor.
# If a test or the build fails, the last good version stays live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits, so a changed tag can't alter what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_SITE_ORIGIN: https://parth3557.github.io
          # Empty until the dashboard is online, so the pages don't post to an address that isn't there.
          PUBLIC_COLLECT_URL: ${{ vars.PUBLIC_COLLECT_URL }}
      - run: npm run test:http
      # Only the static pages go up. The server half of the build is for Vercel, and fonts stay out of the repo.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
