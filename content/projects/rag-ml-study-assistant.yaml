title: RAG ML Study Assistant
badge: Page-cited answers
summary: Reads PDFs with PyMuPDF and Tesseract OCR, searches them with FAISS,
  and answers with Qwen2.5-7B, citing the page.
results:
  - Page-cited answers
tech:
  - PyMuPDF
  - Tesseract OCR
  - MiniLM embeddings
  - FAISS IndexFlatIP
  - Qwen2.5-7B
  - HF Inference
  - Flask
category: genai
repoUrl: https://github.com/Parth3557/RAG
isPrivate: false
featured: true
order: 3
problem: Answer questions about machine learning using your own textbooks as the
  source, and show which page each answer came from.
approach: PDFs are read with PyMuPDF, falling back to Tesseract OCR for scanned
  or image-heavy pages. Text chunks are embedded with all-MiniLM-L6-v2 and
  indexed in FAISS. For each question, the closest passages are retrieved and
  passed to Qwen2.5-7B through the Hugging Face Inference API, so the answer
  stays grounded in that text. The source file, page number and relevance score
  are shown beside it.
