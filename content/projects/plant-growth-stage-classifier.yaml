problem: Detect a plant's growth stage from a photo, and compare how three deep
  learning architectures handle the same task.
approach: EfficientNet-B0, a Vision Transformer and ResNet50V2 sit side by side
  in one Flask app packaged with Docker. Upload a plant image and get a
  classification with a confidence breakdown. EfficientNet and ViT run in
  PyTorch, ResNet50V2 runs in TensorFlow, and the models load only when needed
  to save memory.
