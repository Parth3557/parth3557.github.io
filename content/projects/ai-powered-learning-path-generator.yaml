order: 2
problem: LLM-only learning tools can invent courses and ignore the order topics
  should be learned in. This platform builds a personalized roadmap a student
  can trust.
approach: Each roadmap is grounded in a curated course database and a
  prerequisite graph. A knowledge graph of courses and modules is built from
  MySQL with exact matching and Gemini ontology extraction, and a topological
  traversal puts prerequisites first. Course content is embedded and stored in
  ChromaDB for retrieval. Every recommended step comes with a plain-language
  reason, and those explanations are cached so repeat requests skip the LLM
  call.
