order: 5
problem: Turn plain, low-cost match video into player profiles for grassroots football.
approach: YOLO detects the players, and BoT-SORT, ByteTrack and Deep-EIoU track
  them through the video. Pitch calibration places them on the pitch, and RTS
  smoothing cleans up the kinematics before they become player profiles. A Flask
  demo shows the result.
