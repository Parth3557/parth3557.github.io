isPrivate: false
featured: true
order: 1
problem: Predict an e-commerce product's price from its catalog text and its
  product image, for the Amazon ML Challenge 2025.
approach: "Two encoders run in parallel: BERT reads the catalog text, and a
  Vision Transformer reads the image, where self-attention across image patches
  picks up global cues such as packaging and brand. A fusion head combines them
  and predicts the log of the price, which handles the skewed price
  distribution. Training uses SMAPE, the challenge's own metric, as the loss,
  with AdamW and a cosine learning-rate schedule."
